; Fall-detection wearable -- ESP32 + MPU-6050
;   pio run -e logger   -t upload   # stream raw IMU data for recording
;   pio run -e detector -t upload   # on-device fall detection + BLE alerts

[env]
platform = espressif32@^8.0.0   ; Arduino core 3.x; verified to build both envs
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6

[env:logger]
build_flags = -DMODE_LOGGER
build_src_filter = +<main.cpp> +<imu.cpp> +<app_logger.cpp>

[env:diag]
; wiring check: pio run -e diag -t upload && pio device monitor
build_src_filter = +<main.cpp> +<app_diag.cpp>

[env:detector]
build_flags = -DMODE_DETECTOR
lib_deps =
    ${env.lib_deps}
    h2zero/NimBLE-Arduino@^2.1.0   ; 1.4.x aborts in esp_bt_controller_init on Arduino core 3.x
build_src_filter = +<*> -<app_logger.cpp> -<app_diag.cpp>
board_build.partitions = huge_app.csv
