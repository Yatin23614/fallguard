; Fall-detection wearable -- STM32 Nucleo-F401RE + MPU-6050 + HM-10 (BLE)
;   pio run -e stm32_logger   -t upload   # stream raw IMU data for recording
;   pio run -e stm32_detector -t upload   # on-device fall detection + BLE alerts
; USB serial = ST-LINK virtual COM port (USART2, PA2/PA3).
; The CNN runs on a library-free float32 engine (stm32_model_cnn_f32.cpp), so
; no TensorFlow library is needed on this board.

[env]
platform = ststm32@^20.0.0   ; STM32duino core 4.x (Uart class); verified to build
board = nucleo_f401re
framework = arduino
monitor_speed = 115200
upload_protocol = stlink
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
; newlib-nano needs these to printf/scanf floats
build_flags =
    -Wl,-u,_printf_float
    -Wl,-u,_scanf_float

[env:stm32_logger]
build_flags = ${env.build_flags} -DMODE_LOGGER
build_src_filter = +<stm32_main.cpp> +<stm32_imu.cpp> +<stm32_logger_app.cpp>

[env:stm32_detector]
build_flags = ${env.build_flags} -DMODE_DETECTOR
build_src_filter = +<*> -<stm32_logger_app.cpp>
